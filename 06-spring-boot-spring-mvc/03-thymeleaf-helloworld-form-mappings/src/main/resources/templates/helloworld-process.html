<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hello World - Output Form</title>
</head>
<body>

Hello World of Spring !!!
<br>
<br>
My name is <span th:text="${param.name}"/>
<br>
<br>
The message is <span th:text="${message}"/>
<br>
<br>

<h1 th:text="'Time on the server is ' + ${theDate}"/>


<form th:action="@{/processRequestParam}" method="POST">
    <input type="text" name="name"
           placeholder="What's your Request Param name"/>
    <input type="submit"/>
</form>


</body>
</html>
