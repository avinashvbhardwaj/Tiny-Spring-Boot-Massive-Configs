<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Confirmation Page</title>
</head>
<body>

Student Confirmation Page
<br>
<br>
Student Name: <span th:text="${student.firstName} + '  ' + ${student.lastName}"/>
<br>
<br>
Country: <span th:text="${student.country}"/>
<br>
<br>

Language: <span th:text="${student.lang}"/>
<br>
<br>


Operating systems:
<ul>
    <li th:text="${temp}" th:each="temp : ${student.systems}"/>
</ul>

<br>
<br>

<h1 th:text="'Time on the server is ' + ${theDate}"/>

</body>
</html>
